CACHE_POISONING_PAYLOAD_LEVEL_1=The banner is escaped and included in the cache key.<br/><b>Verify:</b> Send two different banner values and compare the content and <code>X-Cache-Key</code>. Repeating one value may be a cache hit, but it must not show the other value.
CACHE_POISONING_PAYLOAD_LEVEL_1_XSS=HTML supplied as a banner is displayed as text.<br/><b>Verify:</b> Submit markup and confirm that tags and event handlers are escaped in the rendered response, including on a cache hit.
CACHE_POISONING_PAYLOAD_LEVEL_2=The banner is escaped before rendering and each normalized value has its own cache entry.<br/><b>Verify:</b> Compare distinct banner requests, then repeat one request. The matching request may hit the cache without replaying another banner.
CACHE_POISONING_PAYLOAD_LEVEL_2_XSS=Markup and event-handler input remain text instead of executable HTML.<br/><b>Verify:</b> Submit both script-tag and event-handler examples and inspect the rendered response.
CACHE_POISONING_PAYLOAD_LEVEL_3=Asset URLs use a fixed trusted host. The cache key still varies by banner.<br/><b>Verify:</b> Supply an <code>X-Forwarded-Host</code> value, then repeat the same banner without it. Both responses should use <code>static.vulnerableapp.local</code>.
CACHE_POISONING_PAYLOAD_LEVEL_3_JS_INJECTION=An untrusted forwarded host cannot select the asset origin.<br/><b>Verify:</b> Inspect the asset URL and browser network request after supplying a different forwarded host; the trusted host remains in use.
CACHE_POISONING_PAYLOAD_LEVEL_4=Personalized content is sent with <code>Cache-Control: private, no-store</code> and is not stored in the shared application cache.<br/><b>Verify:</b> Request the page with two different <code>demo_user</code> values and then as a guest. Each response should show only its own identity and report a cache miss.
CACHE_POISONING_PAYLOAD_LEVEL_5=This reference level also escapes the banner, ignores untrusted forwarding headers, and sends private, uncached personalized responses.<br/><b>Verify:</b> Compare a personalized request with a guest request, and inspect the trusted asset host and cache diagnostics.
